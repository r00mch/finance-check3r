spring:
  application:
    name: finance-tracker
  datasource:
    # foreign_keys is off by default in SQLite; WAL allows readers during a write
    url: jdbc:sqlite:./finance.db?foreign_keys=on&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite allows a single writer, so a small pool avoids "database is locked"
      maximum-pool-size: 4
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
