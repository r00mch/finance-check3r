spring:
  application:
    name: finance-tracker
  datasource:
    # foreign_keys is off by default in SQLite; WAL allows readers during a write
    url: jdbc:sqlite:./finance.db?foreign_keys=on&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite allows a single writer, so a small pool avoids "database is locked"
      maximum-pool-size: 4
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    # the schema is owned by Flyway; Hibernate must never touch it
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  jwt:
    # HS256 key, at least 32 bytes. The default is for local development ONLY;
    # in any real deployment set the JWT_SECRET environment variable.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration: 1h

management:
  endpoints:
    web:
      exposure:
        include: health,info
